name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --locked: falla si uv.lock no corresponde a pyproject.toml, en vez de resolver
      # versiones distintas a las locales y volver el verde de CI no reproducible.
      - run: uv sync --locked
      - run: uv run pytest -q
