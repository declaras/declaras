[project]
name = "declaras"
version = "0.1.0"
description = "Declaras backend: conector DIAN, motor tributario y capa agentica"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "playwright>=1.49",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    "tenacity>=9.0",
    "httpx>=0.28",
    "openpyxl>=3.1.5",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
gcs = ["google-cloud-storage>=2.19"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "fpdf2>=2.8.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/declaras"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Los scripts de calibracion incluyen texto copiado del portal (con espacios duros)
# y JS embebido; no se les exige el mismo rigor que al paquete.
"scripts/*" = ["RUF001", "E501"]
# FastAPI exige File()/Form() como valor por defecto de los parametros: es el patron
# idiomatico del framework, no una funcion que se ejecuta por accidente.
"src/declaras/api/routers/documents_read.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/declaras"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Librerias sin stubs de tipos.
module = ["google.cloud.*", "openpyxl.*"]
ignore_missing_imports = true
