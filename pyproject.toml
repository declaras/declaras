[project]
name = "declaras"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "anthropic>=0.100",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/declaras"]

[tool.pytest.ini_options]
testpaths = ["tests"]
