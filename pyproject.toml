[project]
name = "declaras"
version = "0.1.0"
description = "Declaras backend: conector DIAN, motor tributario y capa agentica"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "playwright>=1.49",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    # asyncpg NO es opcional: era un extra y un despliegue que no lo instalara arrancaba
    # y no conectaba. El destino es Postgres (Supabase), asi que va en la base.
    "asyncpg>=0.30",
    "structlog>=24.4",
    "tenacity>=9.0",
    "httpx>=0.28",
    "openpyxl>=3.1.5",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    # Motor tributario: parametros del ano gravable en YAML, borrador del 210 en Jinja
    # y los extractores de certificados contra el SDK de Anthropic.
    "pyyaml>=6",
    "jinja2>=3.1",
    "google-genai>=2.16.0",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.19"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "fpdf2>=2.8.7",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/declaras"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# El signo por (×) y el menos (−) son deliberados: la memoria de calculo y el borrador del 210
# se escriben con la notacion que lee un contador ("min(40% × base, 1.340 UVT)"), y los tests
# fijan ese texto renderizado. Sin esto, RUF001/002/003 marcan 72 usos legitimos.
allowed-confusables = ["×", "−"]

[tool.ruff.lint.per-file-ignores]
# Los scripts de calibracion incluyen texto copiado del portal (con espacios duros)
# y JS embebido; no se les exige el mismo rigor que al paquete.
"scripts/*" = ["RUF001", "E501"]

# ── Deuda de la fusion: el motor tributario entra intacto ─────────────────────────────────
# El motor llego de una rama sin ruff, y en esta fusion viaja tal cual para que los 6 goldens
# den las mismas cifras. Nada de esto es un defecto de fondo:
#   RUF012  falso positivo sobre pydantic: `list[X] = []` es seguro, pydantic copia el default.
#   E741    `l` es el laboral / la liquidacion en comprensiones de una linea.
#   I001    bloques de imports sin ordenar.
#   E501    una linea de 101 caracteres en motor/general.py.
# Se limpia con un `ruff check --fix` y ocho renombres, en un commit aparte del de la fusion.
"src/declaras/motor/*" = ["E741", "E501"]
"src/declaras/caso/*" = ["I001", "E741", "RUF012"]
"tests/golden/*" = ["I001"]
"tests/unit/caso/*" = ["I001"]
"tests/unit/motor/*" = ["I001"]
# FastAPI exige File()/Form() como valor por defecto de los parametros: es el patron
# idiomatico del framework, no una funcion que se ejecuta por accidente.
"src/declaras/api/routers/documents_read.py" = ["B008"]
"src/declaras/api/routers/cases.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/declaras"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Librerias sin stubs de tipos.
module = ["google.cloud.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Deuda de la fusion: cinco funciones del motor llegaron de una rama sin type-checking y les
# falta anotar un parametro o el generico del dict. Se relajan solo las reglas de firma, NO
# `ignore_errors`: `check_untyped_defs` sigue activo, asi que los cuerpos de esos cinco modulos
# se siguen comprobando. El motor viaja intacto aqui; las anotaciones van en un commit aparte.
module = [
    "declaras.dinero",
    "declaras.motor.traza",
    "declaras.render.memoria",
    "declaras.render.html",
    "declaras.extraccion.f220",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
